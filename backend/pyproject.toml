[project]
name = "recraft"
version = "0.1.0"
description = "Hopefully the last Minecraft panel you'll ever need."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "mcsmp>=0.0.1",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.39",
    "websockets>=17.0.1",
]

[project.scripts]
recraft = "recraft:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.ruff.format]
skip-magic-trailing-comma = true
